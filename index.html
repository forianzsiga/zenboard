<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zenboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121214">
  <!-- KaTeX for ultra-fast, local TeX math rendering -->
  <link rel="stylesheet" href="vendor/katex.min.css">
  <script defer src="vendor/katex.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Floating Zen Chrome-style Tabs -->
  <div id="tab-bar" class="tab-bar" role="tablist">
    <div id="tab-list" class="tab-list"></div>
    <button id="add-tab-btn" class="tab-btn-add" title="New Board">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <div class="tab-bar-spacer"></div>
    <div class="top-controls">
      <button id="theme-toggle" class="zen-btn icon-btn" title="Toggle Theme (Dark / Light)">
        <span class="icon-sun"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
        <span class="icon-moon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
      </button>
      <button id="draw-tool-btn" class="zen-btn icon-btn" title="Freehand Arrow Draw Tool (D)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path></svg>
      </button>
      <button id="drive-sync-btn" class="zen-btn" title="Google Drive Auto Sync (10s idle / 60s max)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-right:4px;"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg><span id="drive-sync-label">Drive Sync</span>
      </button>
      <button id="export-tab-btn" class="zen-btn" title="Export this tab to a .zmbtab file">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>Export .zmbtab
      </button>
      <button id="add-text-btn" class="zen-btn" title="Add Note (Double click canvas also adds note)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="margin-right:4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Note
      </button>
    </div>
  </div>

  <!-- Infinite Canvas Viewport (GPU Accelerated CSS Transform) -->
  <div id="viewport" class="viewport">
    <div id="canvas" class="canvas">
      <!-- Cards (text, image, video) will be rendered here -->
    </div>
    <!-- SVG Drawing Layer sits directly inside viewport to avoid clearing on renderActiveBoard -->
    <svg id="drawing-svg" class="drawing-layer">
      <defs>
        <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
          <polygon points="0 0, 9 3.5, 0 7" fill="#e87d1e" />
        </marker>
      </defs>
      <g id="drawings-group"></g>
      <path id="active-draw-path" class="active-draw-path" d="" />
    </svg>
  </div>

  <!-- Zen Minimalist Video Editor Modal -->
  <div id="editor-modal" class="editor-modal hidden">
    <div class="editor-backdrop" id="editor-backdrop"></div>
    <div class="editor-content">
      <div class="editor-header">
        <span class="editor-title">Video Transform & Trim</span>
        <button id="editor-close-btn" class="icon-btn-close">&times;</button>
      </div>

      <div class="editor-body">
        <div class="editor-preview-container">
          <div id="editor-crop-box" class="editor-crop-box">
            <video id="editor-video" preload="metadata" playsinline></video>
            <!-- Interactive Crop Overlay -->
            <div id="crop-overlay" class="crop-overlay">
              <div class="crop-handle nw" data-handle="nw"></div>
              <div class="crop-handle ne" data-handle="ne"></div>
              <div class="crop-handle sw" data-handle="sw"></div>
              <div class="crop-handle se" data-handle="se"></div>
            </div>
          </div>
        </div>

        <!-- Controls: Trim range & Actions -->
        <div class="editor-controls">
          <div class="editor-row">
            <button id="editor-play-btn" class="zen-btn">Play</button>
            <span id="editor-time-display" class="time-display">00:00 / 00:00</span>
            <div class="flex-spacer"></div>
            <button id="editor-screenshot-btn" class="zen-btn primary-btn" title="Capture current frame to board">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-right:4px;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>Screenshot to Board
            </button>
          </div>

          <div class="editor-timeline">
            <div class="range-slider">
              <div class="range-track"></div>
              <div id="range-highlight" class="range-highlight"></div>
              <input type="range" id="trim-start" min="0" max="100" step="0.1" value="0">
              <input type="range" id="trim-end" min="0" max="100" step="0.1" value="100">
            </div>
            <div class="trim-labels">
              <span>Start: <span id="trim-start-val">0.0s</span></span>
              <span>End: <span id="trim-end-val">0.0s</span></span>
            </div>
          </div>

          <div class="editor-row editor-footer-row">
            <button id="crop-reset-btn" class="zen-btn">Reset Crop</button>
            <div class="flex-spacer"></div>
            <button id="editor-save-btn" class="zen-btn highlight-btn">Apply Transform</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Card Quick Actions Floating Bar (Shown on Card Selection) -->
  <div id="card-actions-bar" class="actions-bar hidden">
    <label class="fmt-color-wrap" title="Card Backdrop Color">
      <span class="fmt-color-icon bg-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
      </span>
      <input type="color" id="card-bg-color" value="#1e1e24">
    </label>
    <span class="fmt-divider"></span>
    <button class="fmt-btn" id="card-delete-btn" title="Delete Card">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    </button>
  </div>

  <!-- Text Formatting Floating Bar (Shown ONLY when text is actively being edited) -->
  <div id="formatting-bar" class="formatting-bar hidden">
    <button class="fmt-btn" data-cmd="bold" title="Bold"><b>B</b></button>
    <button class="fmt-btn" data-cmd="italic" title="Italic"><i>I</i></button>
    <button class="fmt-btn" data-cmd="underline" title="Underline"><u>U</u></button>
    <span class="fmt-divider"></span>
    <label class="fmt-color-wrap" title="Text Color">
      <span class="fmt-color-icon">A</span>
      <input type="color" id="fmt-text-color" value="#ffffff">
    </label>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg fail:', err));
      });
    }
  </script>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
